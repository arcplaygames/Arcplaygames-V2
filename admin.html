<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arc Play Games — Admin</title><style>
body{margin:0;background:#06020b;color:#fff;font-family:Inter,Arial;padding:28px}main{max-width:1000px;margin:auto}h1{font-size:32px}p{color:#bcb0c9}button,a{padding:11px 15px;border:1px solid #6e43a2;background:#170b27;color:#fff;border-radius:12px;font-weight:800;text-decoration:none;cursor:pointer;margin:0 7px 10px 0}table{width:100%;border-collapse:collapse;background:#0d0617}th,td{padding:12px;border-bottom:1px solid #2b183c;text-align:left;font-size:13px}th{color:#cdaaff}</style></head><body><main><h1>Arc Play Games — X Submissions</h1><p>This viewer reads local browser submissions. For permanent collection, connect the Google Apps Script endpoint from the website package.</p><button onclick="load()">Refresh</button><button onclick="csv()">Export CSV</button><button onclick="clearAll()">Clear</button><a href="index.html">Back</a><div id="out"></div></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const get=()=>JSON.parse(localStorage.getItem("arcPlaySubmissions")||"[]");
function load(){let a=get();out.innerHTML=a.length?`<table><tr><th>#</th><th>X Username</th><th>Wallet</th><th>Time</th></tr>${a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.username)}</td><td>${esc(x.wallet||"—")}</td><td>${new Date(x.createdAt).toLocaleString()}</td></tr>`).join("")}</table>`:"<p>No submissions yet.</p>"}function csv(){let a=get();if(!a.length)return alert("No entries");let rows=[["X Username","Wallet","Submitted"],...a.map(x=>[x.username,x.wallet,x.createdAt])];let c=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\\n"),u=URL.createObjectURL(new Blob([c],{type:"text/csv"})),l=document.createElement("a");l.href=u;l.download="arc-play-submissions.csv";l.click();URL.revokeObjectURL(u)}function clearAll(){if(confirm("Clear local submissions?")){localStorage.removeItem("arcPlaySubmissions");load()}}load();
</script></body></html>
